# Status values: active | stable | wip | scaffold | archive
# Do not invent new project statuses; put nuance in planning.notes instead.
# Relationship keys: runtime_of | site_for | governance_package | depends_on | publishes_to | successor_to
#
# Visibility values: public | private
# public = repo must stay public on GitHub (distribution channel, docs site,
#   or published registry) — its DEV-DOCS cannot live in-repo and are instead
#   extracted into jj-ervin/dev-docs by sync-dev-docs.ps1.
# private = repo is private on GitHub — DEV-DOCS live directly in-repo,
#   tracked normally, no extraction needed.
# Set with set-repo-visibility.ps1; don't hand-edit unless fixing drift.

