name: Dev Folder Manager Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  manager-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate project registry shape
        shell: pwsh
        run: |
          $content = Get-Content projects.yaml -Raw
          if ($content -notmatch '(?m)^projects:\s*$') {
            throw 'projects.yaml must contain a top-level projects: list'
          }
          $names = Select-String -Path projects.yaml -Pattern '^\s+- name:\s+(.+)$'
          $paths = Select-String -Path projects.yaml -Pattern '^    path:\s+(.+)$'
          if ($names.Count -eq 0) { throw 'No projects found in projects.yaml' }
          if ($names.Count -ne $paths.Count) {
            throw "Project name/path count mismatch: $($names.Count) names, $($paths.Count) paths"
          }

      - name: Validate root script syntax
        shell: pwsh
        run: |
          $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content dev-status.ps1 -Raw), [ref]$null)
          $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content dev-environment.ps1 -Raw), [ref]$null)

      - name: Run environment contract preflight
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'environment-contract-fixture'
          New-Item -ItemType Directory -Path $fixture | Out-Null
          @'
          {
            "schemaVersion": "1.0",
            "project": "ci-fixture",
            "powershell": {
              "minimumVersion": "7.0.0",
              "modules": []
            },
            "commands": [
              { "name": "git" }
            ]
          }
          '@ | Set-Content -LiteralPath (Join-Path $fixture '.devtools.json')

          $state = ./dev-environment.ps1 -ProjectPath $fixture -Json | ConvertFrom-Json
          if (-not $state.Ready -or -not $state.PowerShell.Ready -or -not $state.Commands[0].Ready) {
            throw 'Environment contract fixture was not ready.'
          }
